<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UX Interfacely — Experience Letter Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Experience.css">
</head>
<body>
  <h1>Experience Letter Generator</h1>

  <form id="experienceForm" onsubmit="return false;">
    <div class="form-grid">

      <div class="field-group">
        <label for="empName">Full Name</label>
        <input id="empName" type="text" placeholder="Please enter full name here" required>
      </div>

      <div class="field-group">
        <label for="employeeId">Employee ID</label>
        <input id="employeeId" type="text" placeholder="Please enter employee ID here" required>
      </div>

      <div class="field-group">
        <label for="designation">Designation</label>
        <input id="designation" type="text" placeholder="Please enter designation here" required>
      </div>

      <div class="field-group">
        <label for="letterDate">Letter Date</label>
        <input id="letterDate" type="date" required>
      </div>

      <div class="field-group">
        <label for="doj">Date of Joining</label>
        <input id="doj" type="date" required>
        <span class="field-hint" id="dojHint"></span>
      </div>

      <div class="field-group">
        <label for="lastWorkingDate">Last Working Date</label>
        <input id="lastWorkingDate" type="date" required>
        <span class="field-hint" id="lwdHint"></span>
      </div>

      <div class="field-group span-2">
        <label for="emailInput">Recipient's Email</label>
        <input id="emailInput" type="email" placeholder="Please enter recipient's email here">
      </div>

    </div>

    <div class="button-row">
      <button id="lookupBtn" type="button" class="btn-primary btn-wide">Fetch Dates from HRMS</button>
      <button id="generateBtn" type="button" class="btn-primary btn-wide">Generate Experience Letter</button>
      <div class="secondary-buttons">
        <button id="printBtn" type="button">Download as PDF</button>
        <button id="editBtn" type="button" class="icon-btn" disabled>&#9998; Edit Letter</button>
        <button id="emailBtn" type="button" class="icon-btn" disabled>&#9993; Email Letter</button>
        <button id="saveBtn" type="button" class="icon-btn" disabled>&#128190; Save Letter</button>
      </div>
    </div>
  </form>

  <p id="previewStatus"></p>
  <p id="letterEmpty">No letter generated yet. Fill in the form (or fetch from HRMS) and click "Generate Experience Letter".</p>
  <p id="editHint">Editing on — click directly into the letter text to make changes, then click "Done Editing" to lock them in.</p>

  <div id="letterOutput"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
